<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My rewards — Questboard</title>
<link rel="stylesheet" href="/app.css">
<style>
  .head { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 40px 0 24px; }
  .identity { display: flex; flex-direction: column; gap: 10px; }
  .identity .addr { font-size: 15px; display: inline-flex; align-items: center; gap: 10px; }
  .identity .addr code { font-size: 14px; color: var(--text); }
  .totals { display: flex; gap: 12px; flex-wrap: wrap; }
  .total { background: var(--ink-800); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; min-width: 150px; }
  .total .amount { font-size: 26px; }
  .total div { color: var(--text-3); font-size: 13px; margin-top: 4px; }
  .connect-box { padding: 60px 20px; text-align: center; }
  .connect-box h1 { margin-bottom: 10px; }
  .connect-box p { max-width: 44ch; margin: 0 auto 20px; }
  .post-excerpt { color: var(--text-2); font-size: 13px; max-width: 360px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 720px) { .head { grid-template-columns: 1fr; align-items: start; } }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="wrap" id="page"></main>
<script src="/app.js"></script>
<script>
(async function () {
  const { esc, amount, int, ago, mask } = QB;
  const { cfg, user } = await QB.renderTopbar('me');
  const page = document.getElementById('page');
  document.title = `My rewards — ${cfg.brand.name}`;

  if (!user) {
    page.innerHTML = `<div class="connect-box">
      <h1 class="display">Your rewards live here</h1>
      <p class="muted">Connect the wallet you use for quests to see every post you've submitted, what verified, and what was paid.</p>
      <button class="btn btn-primary btn-lg" id="connect">Connect wallet</button>
    </div>`;
    document.getElementById('connect').addEventListener('click', async () => { const u = await QB.connect(); if (u) location.reload(); });
    return;
  }

  const [meData, { submissions }] = await Promise.all([QB.me(), QB.api('GET', '/api/me/submissions')]);
  const sum = meData.summary;
  const totals = sum.earned.length
    ? sum.earned.map((e) => `<div class="total"><span class="amount">${amount(e.total)}<small>${esc(e.token)}</small></span><div>earned</div></div>`).join('')
    : `<div class="total"><span class="amount">0</span><div>earned so far</div></div>`;

  page.innerHTML = `
    <div class="head">
      <div class="identity">
        <h1 class="display">My rewards</h1>
        <span class="addr"><code title="${esc(user.wallet)}">${mask(user.wallet)}</code><button class="btn btn-ghost btn-sm" id="copy">Copy address</button></span>
        <span class="small">${user.x ? `X account <span class="sky" style="font-weight:600">@${esc(user.x.handle)}</span> <button class="btn btn-ghost btn-sm" id="unlink">Unlink</button>` : `<span class="muted">No X account linked yet — link one from any quest page.</span>`}</span>
      </div>
      <div class="totals">${totals}<div class="total"><span class="amount" style="color:var(--text)">${int(sum.verified)}</span><div>verified ${sum.verified === 1 ? 'post' : 'posts'}</div></div>${sum.pending ? `<div class="total"><span class="amount" style="color:var(--sky)">${int(sum.pending)}</span><div>payouts in flight</div></div>` : ''}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Submissions</h3><span class="small faint">${int(submissions.length)} total</span></div>
      ${submissions.length ? `<div class="table-wrap"><table class="data">
        <thead><tr><th>Quest</th><th>Post</th><th>Result</th><th>When</th><th class="right">Reward</th></tr></thead>
        <tbody>${submissions.map((s) => `<tr>
          <td><a href="/quest/${s.quest_id}" style="color:var(--text);font-weight:600">${esc(s.quest_title)}</a></td>
          <td><div class="post-excerpt">${esc(s.tweet_text)}</div><a class="small" href="${esc(s.tweet_url)}" target="_blank" rel="noopener">Open on X</a></td>
          <td>${s.status === 'verified' ? '<span class="tag tag-verified">Verified</span>' : `<span class="tag tag-rejected" title="${esc(s.reject_reason || '')}">Rejected</span>`}${s.status === 'verified' && s.reward_type === 'performance' ? `<div class="small faint">Rank ${s.rank || '—'}</div>` : ''}${s.status === 'rejected' && s.reject_reason ? `<div class="small faint" style="max-width:220px">${esc(s.reject_reason)}</div>` : ''}</td>
          <td class="small muted" data-ago="${esc(s.created_at)}">${ago(s.created_at)}</td>
          <td class="right">${rewardCell(s)}</td>
        </tr>`).join('')}</tbody></table></div>`
      : `<div class="empty"><strong>No submissions yet</strong><a href="/">Pick a quest</a> and submit your first post.</div>`}
    </div>`;

  function rewardCell(s) {
    const r = s.reward;
    if (!r) return s.status === 'verified' && s.reward_type === 'performance' ? '<span class="small faint">Decided at close</span>' : '<span class="faint">—</span>';
    if (r.status === 'sent') return `<div class="mint" style="font-weight:600">${amount(r.amount)} ${esc(r.token)}</div>${r.explorer_url ? `<a class="small" href="${esc(r.explorer_url)}" target="_blank" rel="noopener">View transaction</a>` : `<span class="small faint">${r.simulated ? 'Simulated' : 'Sent'}</span>`}`;
    if (r.status === 'failed') return `<span class="tag tag-failed" title="${esc(r.error || '')}">Payout failed</span><div class="small faint">Being retried</div>`;
    return `<span class="tag tag-queued">Sending ${amount(r.amount)} ${esc(r.token)}</span>`;
  }

  document.getElementById('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(user.wallet); QB.toast('Address copied', 'ok'); } catch { QB.toast(user.wallet); } });
  document.getElementById('unlink')?.addEventListener('click', async () => { await QB.api('POST', '/api/auth/x/unlink'); location.reload(); });
})().catch((e) => { console.error(e); QB.toast(e.message, 'err'); });
</script>
</body>
</html>
